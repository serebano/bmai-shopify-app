name: deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# OWNER-GATED secrets required (repo → Settings → Secrets):
#   SHOPIFY_CLI_PARTNERS_TOKEN  — for `shopify app deploy` (extension + app config)
#   DEPLOY_SSH_KEY, DEPLOY_HOST — for the app-server SSH deploy (shopify.busymate.ai)
jobs:
  shopify-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # Deploys the theme extension + app config to Shopify (versioned by Shopify).
      - run: npx shopify app deploy --force
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}

  app-server-deploy:
    runs-on: ubuntu-latest
    needs: shopify-deploy
    steps:
      - uses: actions/checkout@v4
      # Deploy the SSR app to your own host: ff-only pull, build, prisma migrate
      # deploy, restart the systemd unit, verify systemctl is-active. Wire this up
      # with your own DEPLOY_HOST / DEPLOY_SSH_KEY secrets (see deploy/systemd +
      # deploy/nginx for reference unit + vhost). Left as a no-op echo by default.
      - name: SSH deploy
        run: echo "TODO: ssh \$DEPLOY_HOST 'cd bmai-shopify-app && git pull --ff-only && npm ci && npm run build && npx prisma migrate deploy && sudo systemctl restart bmai-shopify-app && systemctl is-active bmai-shopify-app'"
